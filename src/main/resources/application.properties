# ==========================================
# SERVER CONFIG
# ==========================================
server.port=8080
server.servlet.context-path=/api
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==========================================
# SPRING APPLICATION
# ==========================================
spring.application.name=enterprise-benefits-api

# ==========================================
# DATABASE (Local PostgreSQL - CHANGE IF NEEDED)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_api}
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ==========================================
# 🔥 JWT SECURITY (Local Dev Secret - No Default Fallback Needed, Explicitly Defined)
# ==========================================
spring.security.oauth2.resourceserver.jwt.secret=your-256-bit-secret-key-spring-security-oauth2-2026

# ==========================================
# 🔥 APP CUSTOM PROPERTIES (Har ek property jo @Value demand kar raha hai)
# ==========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.security.public-paths=/auth/**,/auth2/**,/actuator/health,/actuator/info,/swagger-ui/**,/v3/api-docs/**
app.default.client-id=web-client
app.jwt.issuer=https://api.enterprise.com
app.jwt.default-scope=benefits.read
app.jwt.expiration-seconds=900
app.cache.ttl-seconds=300
app.cache.max-size=10000
app.admin.email=admin@enterprise.com
app.admin.password=password

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.example.enterprise_api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ==========================================
# SWAGGER
# ==========================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JACKSON
# ==========================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# ==========================================
# TOMCAT
# ==========================================
server.tomcat.max-connections=200
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10